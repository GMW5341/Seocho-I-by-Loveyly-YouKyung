<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="brush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Paint palette (simplified) -->
  <ellipse cx="30" cy="36" rx="16" ry="14" fill="white" opacity="0.95"/>
  <ellipse cx="30" cy="36" rx="16" ry="14" fill="none" stroke="#e0e7ff" stroke-width="0.5"/>
  <!-- Palette hole -->
  <ellipse cx="28" cy="40" rx="3.5" ry="3" fill="#6366f1" opacity="0.3"/>
  <!-- Paint dots on palette -->
  <circle cx="22" cy="31" r="3" fill="#f43f5e"/>
  <circle cx="29" cy="27" r="3" fill="#f59e0b"/>
  <circle cx="37" cy="29" r="3" fill="#22c55e"/>
  <circle cx="40" cy="36" r="2.8" fill="#3b82f6"/>
  <circle cx="37" cy="42" r="2.5" fill="#a855f7"/>
  <!-- Paintbrush -->
  <g transform="rotate(-40, 44, 16)">
    <!-- Brush handle -->
    <rect x="42" y="8" width="5" height="24" rx="2" fill="url(#brush)"/>
    <!-- Ferrule (metal part) -->
    <rect x="41.5" y="30" width="6" height="4" rx="1" fill="#9ca3af"/>
    <!-- Brush tip -->
    <path d="M42 34 Q44.5 42 47 34 Z" fill="#f43f5e"/>
  </g>
  <!-- Small star sparkle -->
  <g fill="white" opacity="0.8">
    <path d="M12 12 L13 15 L14 12 L13 9 Z"/>
    <path d="M13 12 L10 13 L13 14 L16 13 Z"/>
  </g>
</svg>
